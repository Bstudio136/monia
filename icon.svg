<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="45%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12"
                    flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#0b0712"/>

  <circle cx="256" cy="256" r="210" fill="url(#aura)"/>
  <circle cx="256" cy="256" r="200" fill="url(#circleGrad)"/>
  <circle cx="256" cy="256" r="200" fill="none"
          stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <path d="M126 204 A150 150 0 0 1 204 118"
        fill="none" stroke="#ffffff" stroke-opacity="0.22"
        stroke-width="9" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <g filter="url(#glow)"
       fill="none"
       stroke="url(#bGrad)"
       stroke-width="40"
       stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M176 136 V376"/>
      <path d="M176 136 H238 C300 136 330 162 330 196
               C330 230 300 256 238 256 H176"/>
      <path d="M176 256 H250 C312 256 342 284 342 316
               C342 348 312 376 250 376 H176"/>
    </g>
  </g>
</svg>
