<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="60%" stop-color="#0d0718"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>

    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="40%" stop-color="#4c1d95"/>
      <stop offset="75%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#150a3a"/>
    </linearGradient>

    <linearGradient id="circleShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f0d5ff"/>
      <stop offset="30%" stop-color="#c99cff"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.66  0 0 0 0 0.35  0 0 0 0 1  0 0 0 0.9 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.45" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="url(#aura)"/>

  <g filter="url(#outerGlow)">
    <circle cx="256" cy="256" r="200" fill="url(#circleGrad)"/>
  </g>

  <path d="M80 256 A176 176 0 0 1 432 256 L432 256 A176 176 0 0 0 80 256 Z" fill="url(#circleShine)"/>

  <circle cx="256" cy="256" r="200" fill="none" stroke="#c4a2ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <path d="M118 200 A150 150 0 0 1 210 116" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <path d="M118 200 A150 150 0 0 1 210 116" fill="none" stroke="#e9d5ff" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Ombre portée du D -->
  <g transform="translate(6,12)" opacity="0.65">
    <g filter="url(#softShadow)">
      <g fill="none" stroke="#0a0018" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
        <path d="M200 155 V355"/>
        <path d="M200 155 H250 C335 155 380 195 380 255 C380 315 335 355 250 355 H200"/>
      </g>
    </g>
  </g>

  <!-- Contour graffiti du D -->
  <g fill="none" stroke="#150528" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 155 V355"/>
    <path d="M200 155 H250 C335 155 380 195 380 255 C380 315 335 355 250 355 H200"/>
  </g>

  <!-- Corps bubble du D -->
  <g filter="url(#bGlow)">
    <g fill="none" stroke="url(#bGrad)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 155 V355"/>
      <path d="M200 155 H250 C335 155 380 195 380 255 C380 315 335 355 250 355 H200"/>
    </g>
  </g>

  <!-- Reflets bubble -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 178 V225" stroke-width="12" opacity="0.65"/>
    <path d="M186 268 V325" stroke-width="10" opacity="0.45"/>
    <path d="M218 172 H255 C300 172 335 190 355 220" stroke-width="11" opacity="0.55"/>
    <path d="M220 338 H255 C300 338 335 322 355 292" stroke-width="9" opacity="0.35"/>
  </g>

  <!-- Points brillants -->
  <ellipse cx="218" cy="195" rx="9" ry="13" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="220" cy="295" rx="7" ry="10" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="300" cy="182" rx="6" ry="8" fill="#ffffff" opacity="0.5"/>

  <!-- Gouttes graffiti -->
  <path d="M215 380 Q212 400 210 414 Q216 418 222 412 Q220 398 224 380 Z"
        fill="url(#bGrad)" stroke="#150528" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="216" cy="420" r="5" fill="url(#bGrad)" stroke="#150528" stroke-width="3"/>

  <path d="M300 380 Q302 396 300 410 Q307 414 313 407 Q311 394 315 380 Z"
        fill="url(#bGrad)" stroke="#150528" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="306" cy="416" r="4.5" fill="url(#bGrad)" stroke="#150528" stroke-width="3"/>

  <path d="M250 380 Q248 390 247 398 Q252 401 256 396 Q255 388 257 380 Z"
        fill="url(#bGrad)" stroke="#150528" stroke-width="3.5" stroke-linejoin="round"/>

  <rect width="512" height="512" rx="128" fill="url(#grain)"/>
</svg>
